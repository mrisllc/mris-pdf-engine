
name: Generate Gradle Wrapper & Validate Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-wrapper:
    name: Generate Wrapper & Validate Foundation
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # 01. Checkout Repository
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ----------------------------------------
      # 02. Setup Java 21
      # ----------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # ----------------------------------------
      # 03. Setup Gradle 9.7.0
      # ----------------------------------------
      - name: Setup Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.0"

      # ----------------------------------------
      # 04. Generate Gradle Wrapper
      # ----------------------------------------
      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          BOOTSTRAP="$RUNNER_TEMP/mris-wrapper-bootstrap"

          mkdir -p "$BOOTSTRAP"

          cd "$BOOTSTRAP"

          printf 'rootProject.name = "wrapper-bootstrap"\n' \
            > settings.gradle.kts

          printf 'plugins { base }\n' \
            > build.gradle.kts

          gradle wrapper \
            --gradle-version 9.7.0 \
            --distribution-type bin

          cd "$GITHUB_WORKSPACE"

          mkdir -p gradle/wrapper

          cp "$BOOTSTRAP/gradlew" .
          cp "$BOOTSTRAP/gradlew.bat" .

          cp "$BOOTSTRAP/gradle/wrapper/gradle-wrapper.jar" \
            gradle/wrapper/

          cp "$BOOTSTRAP/gradle/wrapper/gradle-wrapper.properties" \
            gradle/wrapper/

          chmod +x gradlew

      # ----------------------------------------
      # 05. Commit Wrapper Files
      # ----------------------------------------
      - name: Commit Wrapper files
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add gradlew gradlew.bat gradle/wrapper

          if git diff --cached --quiet; then
            echo "No wrapper changes detected."
          else
            git commit -m "build: add Gradle 9.7.0 wrapper"
            git push
          fi

      # ----------------------------------------
      # 06. Verify Gradle Wrapper
      # ----------------------------------------
      - name: Verify Gradle Wrapper
        run: |
          ./gradlew --version

      # ----------------------------------------
      # 07. Validate Root Build
      # ----------------------------------------
      - name: Validate root build
        run: |
          ./gradlew help --configuration-cache

      # ----------------------------------------
      # 08. Compile Convention Plugins
      # ----------------------------------------
      - name: Compile convention plugins
        run: |
          ./gradlew -p build-logic :convention:build

      # ----------------------------------------
      # 09. Validate Foundation Registration
      # ----------------------------------------
      - name: Validate Foundation Registration
        run: |
          set -euo pipefail

          ./gradlew projects

      # ----------------------------------------
      # 10. Validate Foundation Modules
      # ----------------------------------------
      - name: Validate Foundation Modules
        run: |
          set -euo pipefail

          ./gradlew \
            :foundation:foundation-common:build \
            :foundation:foundation-errors:build \
            :foundation:foundation-collections:build \
            :foundation:foundation-io:build \
            :foundation:foundation-memory:build \
            :foundation:foundation-concurrency:build \
            :foundation:foundation-testing:build

      # ----------------------------------------
      # 11. Final Build Verification
      # ----------------------------------------
      - name: Final Build Verification
        run: |
          ./gradlew help --configuration-cache

          echo "=================================="
          echo "MRIS PDF FOUNDATION VALIDATION"
          echo "=================================="
          echo "Gradle Wrapper: VERIFIED"
          echo "Root Build: VERIFIED"
          echo "Convention Plugins: VERIFIED"
          echo "Foundation Registration: VERIFIED"
          echo "Foundation Modules: VERIFIED"
          echo "=================================="
